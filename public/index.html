<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wima</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc;
  --soft: #f0eee9; --accent: #2f5d8a; --ok: #2e7d4f; --warn: #b7791f; --err: #c0392b;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.04);
  --skript: #2f6fd6; --uebung: #8e44ad; --tutorium: #e84393; --sonstiges: #8d8d93;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #151517; --panel: #1f1f22; --ink: #ececef; --muted: #9c9ca3; --line: #2f2f34;
          --soft: #27272b; --accent: #7fb0e0; --shadow: none; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #151517; --panel: #1f1f22; --ink: #ececef; --muted: #9c9ca3; --line: #2f2f34;
          --soft: #27272b; --accent: #7fb0e0; --shadow: none; color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
/* Hell/Dunkel unten links */
#thema { position: fixed; left: 16px; bottom: 16px; z-index: 8; width: 44px; height: 44px; border-radius: 50%; padding: 0;
         font-size: 20px; line-height: 1; box-shadow: var(--shadow); }
/* „neu“: Datei seit dem letzten Öffnen neu oder geändert */
.big { position: relative; }
.big .neu { position: absolute; top: -7px; right: -6px; font-size: 11px; font-weight: 700; letter-spacing: .03em; color: #fff;
            background: var(--accent); padding: 1px 7px; border-radius: 999px; box-shadow: 0 0 0 2px var(--panel); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
         padding: 6px 12px; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 4px 8px; }
button.ghost:hover { color: var(--ink); background: var(--soft); }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
a { color: var(--accent); }

header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
         backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar { max-width: 1840px; margin: 0 auto; padding: 12px 32px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.bar #logout { margin-left: auto; }
.login { max-width: 340px; margin: 12vh auto 0; display: grid; gap: 10px; }
.login .err { font-size: 13px; color: var(--err); margin: 0; }

main { max-width: 1840px; margin: 0 auto; padding: 16px 32px 80px; }
.courses { display: flex; gap: 8px; flex-wrap: wrap; }
.course { padding: 6px 18px; border-radius: 999px; border: 0; font-weight: 650; font-size: 17px; color: #fff;
          background: color-mix(in srgb, var(--c) 55%, var(--bg)); }
.course:hover { background: color-mix(in srgb, var(--c) 80%, var(--bg)); }
.course.on { background: var(--c); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--c); }
body { background: color-mix(in srgb, var(--kurs, var(--bg)) 7%, var(--bg)); }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); }
.form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.form input[type=text] { flex: 1 1 160px; }
.swatches { display: flex; gap: 4px; }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; padding: 0; background: var(--s); }
.swatch.on { border-color: var(--ink); }

.skript { margin-bottom: 22px; }
.skript .card { border: 2px solid var(--skript); }
/* Skript so groß wie das Fällige: große PDF-Knöpfe, größerer Titel */
.skript .card > .top { padding: 12px 16px; }
.skript .card .t { font-size: 20px; }
.skript .kind { font-size: 13px; padding: 3px 10px; }
.skript .trio { gap: 10px; padding-top: 14px; }
.skript .trio .big { padding: 14px 22px 14px 12px; font-size: 20px; gap: 12px; border-radius: 11px; }
.skript .trio .big .ic { width: 40px; height: 50px; font-size: 11px; border-radius: 6px; }
.skript .top { cursor: default; }
.skript .body { display: flex; flex-wrap: wrap; align-items: flex-end; column-gap: 8px; padding-bottom: 12px; }
.skript .more { margin: 0 -6px 0 auto; }
.skript .details, .skript .form { flex-basis: 100%; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.chip { border-radius: 999px; padding: 3px 12px; font-size: 13px; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.timeline { position: relative; padding-left: 104px; }
.timeline::before { content: ""; position: absolute; left: 88px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.month { margin: 22px 0 8px -104px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.entry { position: relative; margin-bottom: 10px; }
.entry .date { position: absolute; left: -104px; width: 76px; text-align: right; top: 13px; font-size: 15px; color: var(--muted); }
.entry::before { content: ""; position: absolute; left: -21px; top: 17px; width: 12px; height: 12px; border-radius: 50%;
                 background: var(--panel); border: 3px solid var(--k); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.card > .top { display: flex; gap: 10px; align-items: center; padding: 10px 14px; cursor: pointer; flex-wrap: wrap; }
.kind { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--k);
        background: color-mix(in srgb, var(--k) 12%, transparent); padding: 2px 8px; border-radius: 6px; }
.card .t { font-weight: 600; }
.card .t small { font-weight: 400; color: var(--muted); }
.sum { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.pill.run { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.pill.err { color: var(--err); background: color-mix(in srgb, var(--err) 12%, transparent); }
.body { border-top: 1px solid var(--line); padding: 0 14px 14px; }
.trio { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; }
.trio .big { padding: 8px 16px 8px 8px; font-size: 17px; }
.big { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
       background: var(--bg); color: var(--ink); text-decoration: none; font-weight: 600; min-width: 0; }
a.big:hover { border-color: var(--k); }
.notizen-wahl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.notizen-wahl button { border-radius: 999px; padding: 1px 10px; font-size: 13px; color: var(--muted); }
.notizen-wahl button.on { background: var(--k); border-color: var(--k); color: #fff; }
.big .n { margin-left: auto; font-size: 12px; color: var(--k); }
.bar .leser-link { text-decoration: none; margin-left: auto; color: inherit; }
.bar .leser-link ~ #logout { margin-left: 0; }
.big .ic { width: 30px; height: 36px; border-radius: 5px; display: grid; place-items: center; font-size: 9px; font-weight: 700;
           color: #fff; background: #d1453b; flex: none; }
.big.leer { color: var(--muted); font-weight: 500; border-style: dashed; background: transparent; }
.big.leer .ic { background: var(--line); }
.big.leer.laeuft .ic { animation: puls 1.4s ease-in-out infinite; }
@keyframes puls { 50% { background: var(--k); } }
.big.drop { place-items: initial; min-height: 0; font-size: inherit; }
.more { display: flex; justify-content: flex-end; gap: 2px; margin: 6px -6px 0 0; }
.more button { font-size: 15px; }
.details { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 12px; }
.sec { margin-bottom: 14px; }
.sec h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
.files { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.file { position: relative; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 9px;
        padding: 6px 28px 6px 8px; max-width: 280px; font-size: 13px; background: var(--bg); text-decoration: none; color: var(--ink); }
.file img { width: 54px; height: 54px; object-fit: cover; border-radius: 6px; background: #fff; }
.file .ic { width: 34px; height: 40px; border-radius: 5px; display: grid; place-items: center; font-size: 10px; font-weight: 700;
            color: #fff; background: var(--muted); flex: none; }
.file .ic.pdf { background: #d1453b; } .file .ic.md { background: var(--accent); }
.file .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file .nm small { display: block; color: var(--muted); }
.file .x { position: absolute; right: 2px; top: 2px; padding: 0 6px; font-size: 14px; }
.drop { border: 1.5px dashed var(--line); border-radius: 9px; padding: 8px 14px; color: var(--muted); font-size: 13px;
        display: grid; place-items: center; min-height: 52px; cursor: pointer; background: transparent; }
.drop:hover, .drop.over { border-color: var(--accent); color: var(--accent); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 14px; padding: 10px; border-radius: 10px; background: var(--soft); }
.actions input { flex: 1 1 200px; }
.doc { border: 1px solid var(--line); border-radius: 10px; padding: 4px 18px; background: var(--bg); max-height: 70vh; overflow: auto; }
.doc h1 { font-size: 20px; } .doc h2 { font-size: 17px; margin-top: 1.4em; } .doc h3 { font-size: 15px; }
.doc blockquote { margin: 0; padding: 2px 12px; border-left: 3px solid var(--accent); color: var(--muted); }
.doc code { background: var(--soft); padding: 1px 4px; border-radius: 4px; }
.doc .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
.versions { font-size: 12px; color: var(--muted); margin-top: 4px; }
.jobs { font-size: 13px; }
.job { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px solid var(--line); }
.job .msg { white-space: pre-wrap; color: var(--muted); flex: 1; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.who { font-size: 12px; font-weight: 600; margin: 10px 0 4px; }
.teile { margin: 14px 0 0; }
.file .prio { display: block; margin-top: 2px; padding: 0 6px; font-size: 11px; border-radius: 999px; color: var(--muted); }
.file .prio.on { color: #fff; background: var(--k); border-color: var(--k); }
.upmenu { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 14px 12px; }
.upmenu b { font-size: 13px; color: var(--muted); font-weight: 600; margin-right: 4px; }
.upmenu button { font-size: 13px; padding: 5px 10px; }
.upbtn { margin-left: auto; font-size: 15px; padding: 4px 12px; }
.upkurs { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.upkurs select { max-width: 100%; }
.prio-up { display: inline-flex; gap: 6px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
.korr { margin-top: 10px; padding: 8px 12px; border-left: 3px solid var(--k); background: var(--soft); border-radius: 0 8px 8px 0; font-size: 13px; }
.korr b { font-size: 12px; color: var(--muted); }
.korr ul, .korr p { margin: 4px 0; } .korr ul { padding-left: 18px; }
/* Board: links Tutorien, rechts Übungen, je Zeile ein Blatt */
.board { display: grid; grid-template-columns: 1fr 1fr; column-gap: 18px; }
.board h3 { margin: 4px 0 4px; font-size: 17px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.zeile { display: contents; }
.zelle { padding: 4px 0; }
.zelle.frueh { padding-bottom: 26px; } .zelle.spaet { padding-top: 26px; }
.kachel { --z: var(--k); display: grid; grid-template-columns: 48px auto 1fr; grid-template-areas: "nr due dat";
          align-items: center; column-gap: 14px; row-gap: 6px; padding: 10px 12px 10px 10px; border-radius: 12px; cursor: pointer;
          background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
.kachel:hover { border-color: color-mix(in srgb, var(--z) 55%, var(--line)); }
/* Farbe und Status stecken im Nummern-Abzeichen: vorbei = Farbe der Art (hell), jetzt = rot (kräftig), später = grau */
.kachel.jetzt, .kachel.jetzt:hover { --z: var(--err); border: 3px solid var(--err); padding: 10px 12px 10px 10px;
  grid-template-columns: 68px auto 1fr; }
/* das Fällige: Nummern-Abzeichen doppelt so breit, PDF-Knöpfe doppelt so hoch */
.kachel.jetzt .nr { width: 68px; height: 68px; font-size: 34px; border-radius: 14px; }
.kachel.jetzt .big { padding: 14px 20px 14px 12px; font-size: 20px; gap: 12px; border-radius: 11px; }
.kachel.jetzt .big .ic { width: 40px; height: 50px; font-size: 11px; border-radius: 6px; }
.kachel.jetzt .due { font-size: 20px; }
/* alles außer dem Fälligen tritt etwas zurück */
.kachel.vorbei, .kachel.spaeter { box-shadow: none; background: color-mix(in srgb, var(--panel) 75%, transparent); }
.kachel.vorbei .due { font-weight: 550; color: var(--muted); }
.kachel.vorbei .nr { background: color-mix(in srgb, var(--z) 9%, transparent); }
.kachel.vorbei .dat { opacity: .85; }
.kachel.spaeter { opacity: .75; }
.kachel.spaeter { --z: #a5a5ab; }
.kachel.spaeter .dat { opacity: .6; }
.kachel .nr { grid-area: nr; align-self: center; width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center;
              font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums;
              color: var(--z); background: color-mix(in srgb, var(--z) 13%, transparent); }
.kachel .due { grid-area: due; font-size: 18px; font-weight: 650; }
.kachel.jetzt .due { color: var(--err); } .kachel.spaeter .due { color: var(--muted); }
.kachel .dat { grid-area: dat; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.kachel .big { --k: var(--z); padding: 8px 16px 8px 8px; font-size: 17px; gap: 10px; border-radius: 9px; }
.kachel .big .ic { width: 28px; height: 34px; font-size: 8px; border-radius: 5px; }
.leerzelle { min-height: 1px; }
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.35); display: grid; place-items: start center;
         padding: 8vh 16px 16px; overflow: auto; }
.sheet > div { width: min(760px, 100%); }
.sheet .zu { display: block; margin: 0 0 8px auto; background: var(--panel); }
.menue { position: relative; }
.menue > button { font-size: 18px; line-height: 1; padding: 6px 10px; }
.menue .liste { position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line);
                border-radius: 10px; box-shadow: var(--shadow); padding: 6px; display: grid; min-width: 190px; z-index: 6; }
.menue .liste a, .menue .liste button { text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 7px;
                color: var(--ink); text-decoration: none; }
.menue .liste a:hover, .menue .liste button:hover { background: var(--soft); }
.bar .notizen-wahl { margin: 0 0 0 auto; font-size: 15px; }
.bar .notizen-wahl button { font-size: 15px; padding: 2px 12px; }
.bar .notizen-wahl button.on { background: var(--accent); border-color: var(--accent); }
.tut { display: grid; gap: 12px; }
.tut .reihe { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tut .reihe b { min-width: 120px; }
.tut p { margin: 0; color: var(--muted); font-size: 14px; }
@media (max-width: 640px) {
  .board { column-gap: 8px; }
  .kachel, .kachel.jetzt { grid-template-columns: 1fr; grid-template-areas: "nr" "due" "dat"; padding: 8px; row-gap: 6px; }
  .kachel .dat { justify-content: flex-start; }
  .kachel .nr { font-size: 22px; width: 38px; height: 38px; } .kachel .due { font-size: 13px; }
  .kachel .dat { grid-template-columns: 1fr; gap: 4px; }
  .kachel .big { padding: 5px 6px; font-size: 12px; gap: 6px; } .kachel .big .ic { width: 18px; height: 22px; font-size: 7px; }
  .timeline { padding-left: 18px; } .timeline::before { left: 4px; }
  .month { margin-left: -18px; }
  .entry .date { position: static; display: block; text-align: left; width: auto; margin-bottom: 2px; }
  .entry::before { left: -19px; top: 5px; }
  .sum { margin-left: 0; width: 100%; }
  .trio { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<header id="header" hidden><div class="bar">
  <nav class="courses" id="courses"></nav>
  <div class="notizen-wahl" id="notizen" title="Wessen Notizen im Leser zu sehen sind – mit Stift, Zetteln und verlinkten Definitionen"></div>
  <div class="menue"><button class="ghost" onclick="S.menue=!S.menue;S.detail=null;render()" title="Einstellungen" aria-label="Einstellungen">☰</button>
    <div id="menue"></div></div>
</div></header>
<main>
  <div id="login"></div>
  <div id="course"></div>
</main>
<div id="overlay"></div>
<button id="thema" onclick="themaWechseln()" title="Hell / Dunkel"></button>
<input type="file" id="picker" multiple hidden accept="image/*,application/pdf,.md,.tex,.txt">

<script>
const ARTEN = { skript: "Vorlesung", uebung: "Übungsblatt", tutorium: "Tutorium", sonstiges: "Sonstiges" };
const ART_PLURAL = { skript: "Vorlesungen", uebung: "Übungen", tutorium: "Tutorien", sonstiges: "Sonstiges" };
const GEMEINSAM = new Set(["verbessern", "lang", "loesung"]);  // darf jeder Worker erledigen
const ORIGINAL = { skript: "Original Skript", uebung: "Original Übungsblatt", tutorium: "Original Tutoriumsblatt", sonstiges: "Original" };
const FARBEN = ["#2f5d8a", "#6c5ce7", "#00897b", "#c0392b", "#d68910", "#8e44ad", "#2e7d4f", "#e84393"];
const JOBS = { aufbereiten: "Lösung aufbereiten", vergleich: "Mit Musterlösung vergleichen",
               verbessern: "Verbessert neu erstellen", lang: "Lang neu erstellen", personalisieren: "Für mich neu erstellen",
               loesung: "Lösung neu erstellen" };
const ROLLEN = { original: "Original", musterloesung: "Musterlösung", foto: "Meine Lösung", notiz: "Notiz",
                 aufbereitet: "Aufbereitet", vergleich: "Vergleich", verbessert: "Verbessert", lang: "Lang", fuer: "Für mich",
                 loesungsteil: "Lösungsteil", loesung: "Lösung" };

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem("wima." + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("wima." + k, JSON.stringify(v)); } catch {} },
};
const S = {
  state: null, items: [], user: null, course: store.get("course", null), login: null,
  filter: store.get("filter", "alle"), open: new Set(store.get("open", [])),
  editItem: null, md: {}, more: new Set(),
  prioUpload: new Set(),  // Einträge, deren nächster Lösungsteil priorisiert hochgeladen wird
  upMenu: null,           // Eintrag, dessen Upload-Menü offen ist
  detail: null,           // Eintrag, dessen Kachel geöffnet ist
  menue: false, tutForm: false, gescrollt: null,
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {},
                                body: body ? JSON.stringify(body) : undefined });
  const data = r.status === 204 ? null : await r.json();
  if (r.status === 401 && path !== "/api/login") { await showLogin(); throw new Error("nicht angemeldet"); }
  if (!r.ok) { alert(data?.error || r.statusText); throw new Error(data?.error); }
  return data;
}
const fmtDate = (d) => d ? new Date(d + "T00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "short" }) : "";
const fmtMonth = (d) => d ? new Date(d + "T00:00").toLocaleDateString("de-DE", { month: "long", year: "numeric" }) : "Ohne Datum";
const fmtSize = (n) => n > 1e6 ? (n / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1e3)) + " KB";
const ago = (iso) => {
  if (!iso) return null;
  return (new Date(S.state.now) - new Date(iso)) / 1000;
};

// ---------------------------------------------------------------- Markdown + Mathe
function renderMd(text) {
  const math = [];
  const keep = (t, display) => { math.push([t, display]); return `@@M${math.length - 1}@@`; };
  text = text.replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => keep(t, true))
             .replace(/\\\[([\s\S]+?)\\\]/g, (_, t) => keep(t, true))
             .replace(/\$([^$\n]+?)\$/g, (_, t) => keep(t, false))
             .replace(/\\\(([\s\S]+?)\\\)/g, (_, t) => keep(t, false));
  return marked.parse(text).replace(/@@M(\d+)@@/g, (_, i) => {
    const [t, display] = math[+i];
    try { return katex.renderToString(t, { displayMode: display, throwOnError: false }); }
    catch { return esc(t); }
  });
}

const TAGE = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const kurs = () => S.state.courses.find((c) => c.id === S.course);
const reihe = (k, art) => (S.state.plan?.reihen || []).find((r) => r.kurs === k?.kuerzel && r.art === art);
const tutorienEinst = () => S.state.einstellungen?.tutorien || {};
// Kurse mit Tutorium (laut Stundenplan): dort braucht jede Person ihre eigene Tutoriumszeit
const tutKurse = () => S.state.courses.filter((c) => reihe(c, "tutorium"));

  : tutKurse().filter((c) => !tutorienEinst()[c.id]);

const plusTage = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mitZeit = (d, zeit) => { const [h, m] = zeit.split(":").map(Number); const x = new Date(d); x.setHours(h, m, 0, 0); return x; };
// „Abgabe bis Mi 28.10., 15:00“ / „Tutorium Do 05.11., 14:15“ -> Datum (Jahr aus dem Erscheinungsdatum)
function ausTitel(it) {
  const m = (it.titel || "").match(/(\d{1,2})\.(\d{1,2})\.?,?\s*(?:(\d{1,2})[:.](\d{2}))?/);
  if (!m || !it.datum) return null;
  const start = new Date(it.datum + "T00:00");
  let jahr = start.getFullYear();
  if (+m[2] < start.getMonth() + 1 - 6) jahr++;  // Dezember-Blatt mit Abgabe im Januar
  return new Date(jahr, m[2] - 1, m[1], m[3] ? +m[3] : 23, m[4] ? +m[4] : 59);
}
// Fälligkeit: Übung = Abgabe; Tutorium = die eigene Tutoriumszeit in der Woche, in der das Blatt besprochen wird
function faellig(it) {
  if (!it.datum) return null;
  const start = new Date(it.datum + "T00:00");
  const t = it.art === "tutorium" && tutorienEinst()[it.course_id ?? S.course];
  if (t) {
    const woche = reihe(kurs(), "tutorium")?.besprechung_woche ?? 0;
    const montag = plusTage(start, -((start.getDay() + 6) % 7) + 7 * woche);
    let d = mitZeit(plusTage(montag, t.tag - 1), t.zeit);
    if (d <= start) d = plusTage(d, 7);
    return d;
  }
  return ausTitel(it) || mitZeit(plusTage(start, 7), "23:59");
}
const fmtDue = (d) => d ? `${TAGE[d.getDay()]} ${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}. · ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}` : "";

function renderBoard(blaetter) {
  const jetzt = new Date();
  const due = new Map(blaetter.map((it) => [it.id, faellig(it)]));
  // je Spalte: vorbei = in der Farbe der Art, das nächste fällige = rot, alles danach = grau
  const zustand = new Map();
  for (const art of ["tutorium", "uebung"]) {
    const liste = blaetter.filter((i) => i.art === art).sort((a, b) => (due.get(a.id) ?? 0) - (due.get(b.id) ?? 0));
    let naechstes = true;
    for (const it of liste) {
      const d = due.get(it.id);
      if (d && d < jetzt) zustand.set(it.id, "vorbei");
      else if (naechstes) { zustand.set(it.id, "jetzt"); naechstes = false; }
      else zustand.set(it.id, "spaeter");
    }
  }
  // Zeilen = Blattnummer, neueste oben; in jeder Zeile steht das früher Fällige etwas höher
  const zeilen = new Map();
  for (const it of blaetter) {
    const nr = String(it.nummer ?? "?");
    zeilen.set(nr, { ...zeilen.get(nr), [it.art]: it });
  }
  const sortiert = [...zeilen.entries()].sort(([a, x], [b, y]) => {
    const da = due.get((x.uebung || x.tutorium).id) ?? 0, db = due.get((y.uebung || y.tutorium).id) ?? 0;
    return db - da || (parseInt(b) || 0) - (parseInt(a) || 0);  // neueste oben
  });
  // genau zwei Zustände je Kurs: Mehrheit der Zeilen, in denen beides fällig ist
  let tutFrueher = 0;
  for (const [, z] of sortiert) if (z.tutorium && z.uebung)
    tutFrueher += due.get(z.tutorium.id) < due.get(z.uebung.id) ? 1 : -1;
  const vorn = tutFrueher > 0 ? "tutorium" : "uebung";
  const zelle = (it, art) => `<div class="zelle ${art === vorn ? "frueh" : "spaet"}">${it ? kachel(it, zustand.get(it.id), due.get(it.id)) : `<div class="leerzelle"></div>`}</div>`;
  return `<div class="board"><h3>Tutorium</h3><h3>Übung</h3>
    ${sortiert.map(([, z]) => `<div class="zeile">${zelle(z.tutorium, "tutorium")}${zelle(z.uebung, "uebung")}</div>`).join("")}
  </div>`;
}
function kachel(it, zustand, d) {
  return `<div class="kachel ${zustand}" style="--k:var(--${it.art})" onclick="if(!event.target.closest('a'))S.detail=${it.id},render()">
    <div class="nr">${esc(it.nummer ?? "")}</div>

  </div>`;

// Original / Verbessert / Lösung als PDF-Kacheln; fehlende grau (pulsierend, solange Claude daran arbeitet)
function pdfKacheln(it) {
  const laeuft = (typ) => it.jobs.some((j) => j.typ === typ && (j.status === "offen" || j.status === "laeuft"));
  const k = (label, f, typ) => {
    if (!f) return `<div class="big leer ${typ && laeuft(typ) ? "laeuft" : ""}"><span class="ic"></span>${label}</div>`;
    const n = it.notizen?.[f.rolle];
    return `<a class="big" href="${dateiLink(f)}" target="_blank" title="${esc(f.name)}" onclick="gesehen(${it.id},'${f.rolle}')"><span class="ic">${esc((f.name.split(".").pop() || "").toUpperCase().slice(0, 4))}</span>${label}${n ? `<span class="n">✎</span>` : ""}${neuMarke(it, f)}</a>`;
  };
  return k("Original", neueste(shared(it, "original")))
    + k("Verbessert", neueste(shared(it, "verbessert")), "verbessern")
    + k("Lösung", neueste(shared(it, "loesung").filter((f) => !f.name.endsWith(".md"))), "loesung");
}

// Neben dem Eintrag keine Räume; bei Übungsblättern nur der Abgabetag, bei Tutorien Tag und Uhrzeit
function kurzTitel(it) {
  let t = (it.titel || "").split(/,\s*/).filter((p) => !/^([A-Z]{1,2} ?\d{3}|Raum|HS|Hörsaal)\b/.test(p)).join(", ");
  if (it.art === "uebung") t = t.replace(/^Abgabe bis /, "Abgabe ").replace(/,\s*\d{1,2}[:.]\d{2}( Uhr)?$/, "");
  if (it.art === "tutorium") t = t.replace(/^Tutorium\s*/, "");
  return t;
}

  return `<a class="file" href="/files/${f.id}" target="_blank" title="${esc(f.name)}">
    ${img ? `<img src="/files/${f.id}" loading="lazy">` : `<span class="ic ${ext}">${esc(ext.toUpperCase().slice(0, 4))}</span>`}
    <span class="nm">${esc(f.name)}<small>${esc(sub)}</small>${extra}</span>
    ${del ? `<button class="ghost x" title="Löschen" onclick="event.preventDefault();event.stopPropagation();delFile(${f.id})">×</button>` : ""}
  </a>`;
}
function fileSection(it, rolle, owner, titel, hint) {
  const fs = it.files.filter((f) => f.rolle === rolle && (owner ? f.owner === owner : !f.owner));
  return `<div class="sec">${titel ? `<h4>${titel}</h4>` : ""}<div class="files">
    ${fs.map((f) => fileTile(f)).join("")}
    <div class="drop" data-item="${it.id}" data-rolle="${rolle}" data-owner="${owner || ""}">${hint || "+ Dateien hochladen oder hierher ziehen"}</div>
  </div></div>`;
}
function docSection(files, titel) {
  // generierte Markdown-Dokumente: neueste Version inline, ältere als Links
  if (!files.length) return "";
  const list = [...files].reverse();
  const last = list[0];
  let body;
  if (last.name.endsWith(".md")) { loadMd(last.id); body = `<div class="doc">${S.md[last.id] || ""}</div>`; }
  else body = `<div class="files">${list.filter((f) => f.job_id === last.job_id).map((f) => fileTile(f)).join("")}</div>`;
  const older = list.filter((f) => f.job_id !== last.job_id);
  return `<div class="sec"><h4>${titel} <a href="/files/${last.id}" target="_blank" style="font-weight:400">öffnen</a></h4>${body}
    ${older.length ? `<div class="versions">Ältere Versionen: ${older.map((f) =>
      `<a href="/files/${f.id}" target="_blank">${esc(f.created.slice(0, 16).replace("T", " "))}</a>`).join(" · ")}</div>` : ""}</div>`;
}
function actionBar(it, typen) {
  const busy = it.jobs.some((j) => j.status === "offen" || j.status === "laeuft");
  return `<div class="actions">
    <input type="text" id="hint_${it.id}" placeholder="Hinweis an Claude (optional), z. B. „Seite 2 gehört zu Aufgabe 3“">
    ${typen.map((t) => `<button class="primary" ${busy ? "disabled" : ""} onclick="startJob(${it.id},'${t}')">${JOBS[t]}</button>`).join("")}
  </div>`;
}

// Die Dateien: Original, Verbessert, (bei Vorlesungen) Lang, Für <Name> (jeweils die neueste, bevorzugt PDF)
function neueste(files) {
  const pdf = files.filter((f) => f.name.toLowerCase().endsWith(".pdf"));
  return (pdf.length ? pdf : files).at(-1);
}
// „Notizen: Carl Emil …“ in der Kopfleiste: wessen Notizen im Leser zu sehen sind, eine Einstellung pro Nutzer (Server)
function notizSicht() {
  const e = S.state?.einstellungen?.notizen;
  if (e) return e;
  // früher je Eintrag und Gerät gemerkt: alle damals gewählten Nutzer übernehmen
  const alt = Object.values(store.get("notizenSicht", {})).flat();
  return (S.state?.users || []).filter((u) => alt.includes(u));
}
async function toggleNotizen(user) {
  const v = notizSicht();
  const notizen = v.includes(user) ? v.filter((u) => u !== user) : [...v, user];
  S.state.einstellungen = { ...S.state.einstellungen, notizen };
  render();
  store.set("notizenGlobal", notizen);  // der Leser in einem anderen Tab zieht sofort nach
  S.state.einstellungen = await api("PUT", "/api/einstellungen", { notizen });
}
const sicht = () => notizSicht();
function trio(it) {
  const laeuft = (typ) => it.jobs.some((j) => j.typ === typ && (typ !== "personalisieren" || j.owner === S.user)
                                         && (j.status === "offen" || j.status === "laeuft"));
  // Mindestens ein Nutzer gewählt: die Fassungen öffnen im Leser mit dessen Notizen (Stift, Zettel …), sonst reine PDF
  const gewaehlt = sicht(it.id);
  const mitNotizen = gewaehlt.length > 0;
  const kachel = (label, f, typ) => {
    if (!f) return `<div class="big leer ${typ && laeuft(typ) ? "laeuft" : ""}"><span class="ic"></span>${label}</div>`;
    const ic = `<span class="ic">${esc((f.name.split(".").pop() || "").toUpperCase().slice(0, 4))}</span>`;
    const pdf = f.name.toLowerCase().endsWith(".pdf");
    const n = it.notizen?.[f.rolle];
    if (mitNotizen && pdf)
      return `<a class="big" href="/leser/#/wima/${f.id}" target="_blank" title="${esc(f.name)} mit Notizen öffnen" onclick="gesehen(${it.id},'${f.rolle}')">${ic}${label}
        <span class="n">✎${n ? ` ${n.geaendert.slice(8, 10)}.${n.geaendert.slice(5, 7)}.` : ""}</span>${neuMarke(it, f)}</a>`;
    return `<a class="big" href="/files/${f.id}" target="_blank" title="${esc(f.name)}" onclick="gesehen(${it.id},'${f.rolle}')">${neuMarke(it, f)}${ic}${label}${pdf && n ? `<span class="n" title="Hat Notizen – oben in der Kopfleiste bei „Notizen“ Nutzer wählen">✎</span>` : ""}</a>`;
  };
  const orig = neueste(shared(it, "original"));
  const lang = it.art === "skript";
  const loesung = it.art === "uebung" || it.art === "tutorium";
  return `<div class="trio" style="--n:${lang || loesung ? 3 : 2}">
    ${orig ? kachel("Original", orig) : `<div class="big leer drop" data-item="${it.id}" data-rolle="original" data-owner=""><span class="ic"></span>Original</div>`}
    ${kachel("Verbessert", neueste(shared(it, "verbessert")), "verbessern")}
    ${lang ? kachel("Lang", neueste(shared(it, "lang")), "lang") : ""}
    ${loesung ? kachel("Lösung", neueste(shared(it, "loesung")), "loesung") : ""}
  </div>`;
}
// Upload-Ziele je Art: [Schlüssel, Beschriftung]; der Schlüssel bestimmt Rolle, Besitzer und Prio
const ZIELE = {
  tafel:   { rolle: "loesungsteil", prio: true },  loesung: { rolle: "loesungsteil" },
  blatt:   { rolle: "original" },                   muster:  { rolle: "musterloesung" },
  eigene:  { rolle: "foto", privat: true },         notiz:   { rolle: "notiz", privat: true },
};
function upZiele(it) {
  if (it.art === "uebung" || it.art === "tutorium")
    return [["tafel", "Tafel / Tutor (priorisiert)"], ["loesung", "Lösung oder Notiz (für alle)"],
            ["blatt", "Aufgabenblatt"], ["muster", "Musterlösung"], ["eigene", "Eigene Lösung"], ["notiz", "Eigene Notizen"]];
  return [["blatt", it.art === "skript" ? "Skript (neue Version)" : "Datei (für alle)"], ["notiz", "Eigene Notizen / Mitschrift"]];
}
function waehleUpload(itemId, ziel) {
  const z = ZIELE[ziel];
  if (z.prio) S.prioUpload.add(itemId); else S.prioUpload.delete(itemId);
  dropTarget = { item: String(itemId), rolle: z.rolle, owner: z.privat ? S.user : "" };
  S.upMenu = null;
  $("#picker").click();
}
// Lösungen und Notizen (für alle), aus denen Claude die eine saubere „Lösung“ baut
function loesungsTeile(it) {
  const fertig = shared(it, "loesung");
  const letzter = Math.max(0, ...fertig.map((f) => f.job_id || 0));
  const korr = fertig.find((f) => (f.job_id || 0) === letzter && f.name.endsWith(".md"));
  if (korr) loadMd(korr.id);
  const prioTile = (f) => fileTile(f, { extra: `<button class="prio ${f.prio ? "on" : ""}"
    title="Bei mehreren Versionen einer Aufgabe diese nehmen, z. B. die Lösung des Tutors"
    onclick="event.preventDefault();event.stopPropagation();setPrio(${f.id},${f.prio ? 0 : 1})">${f.prio ? "★ priorisiert" : "☆ priorisieren"}</button>` });
  return `<div class="sec teile"><h4>Lösungen &amp; Notizen</h4><div class="files">
    ${shared(it, "loesungsteil").map(prioTile).join("")}
    <div class="drop" data-item="${it.id}" data-rolle="loesungsteil" data-owner="">+ Lösung oder Notiz hochladen, auch Teile</div>
  </div>
  <label class="prio-up"><input type="checkbox" ${S.prioUpload.has(it.id) ? "checked" : ""}
    onchange="S.prioUpload[this.checked ? 'add' : 'delete'](${it.id})"> nächsten Upload priorisieren</label>
  ${korr ? `<div class="korr"><b>Geändert gegenüber den Uploads</b>${S.md[korr.id] || ""}</div>` : ""}</div>`;
}
function details(it) {
  let h = fileSection(it, "original", null, ORIGINAL[it.art], "+ Original hochladen");
  if (it.art === "uebung" || it.art === "tutorium") {
    h += fileSection(it, "musterloesung", null, "Musterlösung", "+ Musterlösung hochladen");
    h += fileSection(it, "foto", S.user, "Deine Lösung", "+ Fotos / Scans hochladen");
    h += docSection(mine(it, "aufbereitet"), "Aufbereitete Lösung (PDF)");
    h += docSection(mine(it, "vergleich"), "Vergleich mit der Musterlösung");
    h += docSection(shared(it, "loesung").filter((f) => !f.name.endsWith(".md")), "Lösung (PDF + LaTeX)");
  }
  h += fileSection(it, "notiz", S.user, "Deine Notizen", "+ Notizen (Fotos, PDF, .md) hochladen");
  const typen = (it.art === "uebung" || it.art === "tutorium") ? ["aufbereiten", "vergleich", "loesung"] : [];
  return h + actionBar(it, [...typen, "verbessern", ...(it.art === "skript" ? ["lang"] : [])]);
}
function renderJobs(it) {
  it = { ...it, jobs: it.jobs.filter((j) => j.typ !== "personalisieren") };  // „Für <Name>“ ist abgeschaltet
  if (!it.jobs.length) return "";
  const icon = { offen: "⏳", laeuft: "⚙️", fertig: "✅", fehler: "⚠️" };
  return `<div class="sec jobs"><h4>Claude-Aufträge</h4>${it.jobs.slice(0, 6).map((j) => `<div class="job">
    <span>${icon[j.status]}</span>
    <div style="flex:1"><b>${JOBS[j.typ]}</b> · ${esc(j.owner)} · ${esc((j.created || "").slice(5, 16).replace("T", " "))}
      ${j.status === "offen" ? `<div class="msg">${GEMEINSAM.has(j.typ) ? "Wartet auf einen laufenden Worker …" : `Wartet auf ${esc(j.owner)}s Worker …`}</div>` : ""}
      ${j.status === "laeuft" ? `<div class="msg">Claude arbeitet seit ${esc((j.started || "").slice(11, 16))} …</div>` : ""}
      ${j.ergebnis ? `<div class="msg">${esc(j.ergebnis)}</div>` : ""}</div>
    ${j.status === "fehler" || j.status === "laeuft" ? `<button class="ghost" onclick="retryJob(${j.id})">Neu starten</button>` : ""}
    <button class="ghost" onclick="delJob(${j.id})">×</button>
  </div>`).join("")}</div>`;
}

// ---------------------------------------------------------------- Aktionen
async function selectCourse(id) { S.course = id; S.filter = "alle"; S.editItem = null; S.detail = null; await loadItems(); render(); }
function toggle(id) { S.open.has(id) ? S.open.delete(id) : S.open.add(id); render(); }
async function neuesSkript() {
  const it = await api("POST", "/api/items", { course_id: S.course, art: "skript", nummer: "1", titel: "Skript",
                                              datum: new Date().toISOString().slice(0, 10) });
  await refresh();
  waehleUpload(it.id, "blatt");
}
async function saveItem(id) { await api("PATCH", `/api/items/${id}`, readItemForm()); S.editItem = null; await refresh(); }
async function delItem(id) {
  if (!confirm("Eintrag mit allen Dateien löschen?")) return;
  await api("DELETE", `/api/items/${id}`); await refresh();
}
async function setPrio(id, prio) { await api("PATCH", `/api/files/${id}`, { prio }); await refresh(); }
async function delFile(id) { if (confirm("Datei löschen?")) { await api("DELETE", `/api/files/${id}`); await refresh(); } }
async function startJob(itemId, typ) {
  const hinweis = $(`#hint_${itemId}`)?.value.trim() || null;
  await api("POST", "/api/jobs", { item_id: itemId, typ, hinweis });
  await refresh();
}
async function retryJob(id) { await api("POST", `/api/jobs/${id}/retry`, {}); await refresh(); }
async function delJob(id) { await api("DELETE", `/api/jobs/${id}`); await refresh(); }

// Online nimmt Vercel höchstens 4,5 MB pro Anfrage an: große Fotos vorher verkleinern
async function verkleinern(f) {
  if (!f.type.startsWith("image/") || f.size < 3.5e6) return f;
  const bild = await createImageBitmap(f);
  const k = Math.min(1, 2600 / Math.max(bild.width, bild.height));
  const c = Object.assign(document.createElement("canvas"), { width: bild.width * k, height: bild.height * k });
  c.getContext("2d").drawImage(bild, 0, 0, c.width, c.height);
  const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.85));
  return new File([blob], f.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" });
}
async function upload(files, { item, rolle, owner }) {
  // Lösungsteile: Claude erst nach der letzten Datei starten, sonst sieht es nur die erste
  const teil = rolle === "loesungsteil";
  const prio = teil && S.prioUpload.delete(+item);
  let ok = 0;
  for (const original of files) {
    const f = await verkleinern(original);
    const qs = new URLSearchParams({ item, rolle, owner, name: f.name });
    if (teil) qs.set("spaeter", "1");
    if (prio) qs.set("prio", "1");
    const r = await fetch(`/api/upload?${qs}`, { method: "POST", body: f });
    if (r.status === 401) return showLogin();
    if (!r.ok) alert(`Upload von ${f.name} fehlgeschlagen: ${(await r.json()).error}`);
    else ok++;
  }
  if (teil && ok) await api("POST", "/api/jobs", { item_id: +item, typ: "loesung" });
  await refresh();
}
document.addEventListener("click", (e) => { if (S.menue && !e.target.closest(".menue")) { S.menue = false; render(); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (S.detail || S.menue)) { S.detail = null; S.menue = false; render(); } });
let dropTarget = null;
$("#picker").addEventListener("change", (e) => { if (dropTarget) upload([...e.target.files], dropTarget); e.target.value = ""; });
function bindDrop(el) {
  const target = { item: el.dataset.item, rolle: el.dataset.rolle, owner: el.dataset.owner };
  el.onclick = () => { dropTarget = target; $("#picker").click(); };
  el.ondragover = (e) => { e.preventDefault(); el.classList.add("over"); };
  el.ondragleave = () => el.classList.remove("over");
  el.ondrop = (e) => { e.preventDefault(); el.classList.remove("over"); upload([...e.dataTransfer.files], target); };
}

// Polling nur, solange Claude etwas tut: Jede Abfrage weckt online die Datenbank.
// Nicht neu rendern, während jemand in ein Feld tippt — sonst ist die Eingabe weg.
setInterval(async () => {
  if (document.hidden || !S.state) return;
  const busy = S.items.some((i) => i.jobs.some((j) => j.status === "offen" || j.status === "laeuft"));
  if (!busy) return;
  const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement?.tagName);
  await loadItems();
  if (!(typing || S.editItem)) render();
}, 15000);
refresh();
</script>
